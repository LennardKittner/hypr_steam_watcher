name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: test
        run:  cargo test

  publish-aur:
      runs-on: ubuntu-latest
      needs: [build-linux]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v3
          with:
            fetch-depth: 0  # needed to get full commit history for rev-list

        - name: Clone AUR repo
          run: git clone https://aur.archlinux.org/hypr_steam_watcher-git.git aur-pkg

        - name: Compute and update pkgver
          run: |
            PKGVER=$(git describe --long --abbrev=7 | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
            sed -i "s/^pkgver=.*/pkgver=$PKGVER/" aur-pkg/PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" aur-pkg/PKGBUILD

        - name: Publish to AUR
          uses: KSXGitHub/github-actions-deploy-aur@v4.1.1

          with:
            pkgname: hypr_steam_watcher-git
            pkgbuild: ./aur-pkg/PKGBUILD 
            commit_username: ${{ secrets.AUR_USERNAME }}
            commit_email: ${{ secrets.AUR_EMAIL }}
            ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
            commit_message: Automatic update to latest
            updpkgsums: false
            allow_empty_commits: false
            ssh_keyscan_types: rsa,ecdsa,ed25519
